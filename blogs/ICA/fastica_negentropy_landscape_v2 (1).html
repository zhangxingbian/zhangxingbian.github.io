<style>
.fn-btn{font-size:12px;padding:5px 14px;margin:0 4px 6px 0}
.fn-btn.on{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.mc2{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px}
.mc2 .l{font-size:12px;color:var(--color-text-secondary)}
.mc2 .v{font-size:16px;font-weight:500;color:var(--color-text-primary);margin-top:2px}
</style>
<div style="padding:0.5rem 0">
<div id="fsel2"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 0">
  <div>
    <canvas id="cvLand" width="340" height="280" style="width:100%;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary)"></canvas>
    <div style="text-align:center;font-size:12px;color:var(--color-text-secondary);margin-top:3px">Negentropy J(θ) vs projection angle θ</div>
  </div>
  <div>
    <canvas id="cvProj" width="340" height="280" style="width:100%;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary)"></canvas>
    <div style="text-align:center;font-size:12px;color:var(--color-text-secondary);margin-top:3px">Data + current w direction + histogram</div>
  </div>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:8px 0">
  <label style="font-size:13px;color:var(--color-text-secondary);min-width:60px">Angle θ</label>
  <input type="range" id="ang2" min="0" max="180" value="0" step="1" style="flex:1" oninput="updateAngle()">
  <span id="ang2-v" style="font-size:13px;font-weight:500;min-width:36px;text-align:right">0°</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0">
  <div class="mc2"><div class="l">Current angle</div><div class="v" id="m2-ang">0°</div></div>
  <div class="mc2"><div class="l">J(θ) at current angle</div><div class="v" id="m2-j" style="color:var(--color-text-info)">--</div></div>
  <div class="mc2"><div class="l">Peak angle (true source)</div><div class="v" id="m2-peak">--</div></div>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
  <button onclick="animateSweep()">Sweep animation</button>
  <button onclick="animateFastICA()">Run FastICA climb</button>
  <button onclick="resetData2()">New random data</button>
</div>
<div style="font-size:13px;color:var(--color-text-secondary);margin-top:8px;line-height:1.7" id="expl2"></div>
</div>
<script>
var dk2=matchMedia('(prefers-color-scheme:dark)').matches;
var N2=800;
var zx2=[],zy2=[];
var fn2='logcosh';
var landscape=[];
var peakAng=0;
var anim2=null;

var fns2={
  logcosh:{G:function(u){return Math.log(Math.cosh(u));},g:function(u){return Math.tanh(u);},gp:function(u){var t=Math.tanh(u);return 1-t*t;},col:'#0F6E56'},
  cube:{G:function(u){return Math.pow(u,4)/4;},g:function(u){return Math.pow(u,3);},gp:function(u){return 3*u*u;},col:'#534AB7'},
  gauss:{G:function(u){return -Math.exp(-u*u/2);},g:function(u){return u*Math.exp(-u*u/2);},gp:function(u){return (1-u*u)*Math.exp(-u*u/2);},col:'#D85A30'}
};

function genData2(){
  var s1=[],s2=[];
  for(var i=0;i<N2;i++){s1.push(Math.random()*2-1);s2.push((Math.random()<0.5?-1.5:1.5)+0.35*(Math.random()+Math.random()+Math.random()-1.5));}
  var A2=[[0.8,0.5],[0.35,0.9]];
  var x1=[],x2=[];
  for(var i=0;i<N2;i++){x1.push(A2[0][0]*s1[i]+A2[0][1]*s2[i]);x2.push(A2[1][0]*s1[i]+A2[1][1]*s2[i]);}
  var mx=x1.reduce(function(a,b){return a+b;},0)/N2;
  var my=x2.reduce(function(a,b){return a+b;},0)/N2;
  var cx=x1.map(function(v){return v-mx;});
  var cy=x2.map(function(v){return v-my;});
  var c00=0,c01=0,c11=0;
  for(var i=0;i<N2;i++){c00+=cx[i]*cx[i];c01+=cx[i]*cy[i];c11+=cy[i]*cy[i];}
  c00/=N2;c01/=N2;c11/=N2;
  var tr=c00+c11,det=c00*c11-c01*c01;
  var disc=Math.sqrt(Math.max(tr*tr/4-det,0));
  var l1=tr/2+disc,l2=tr/2-disc;
  var e1x=c01,e1y=l1-c00,e2x=c01,e2y=l2-c00;
  var n1=Math.sqrt(e1x*e1x+e1y*e1y)||1,n2=Math.sqrt(e2x*e2x+e2y*e2y)||1;
  e1x/=n1;e1y/=n1;e2x/=n2;e2y/=n2;
  var sv1=1/Math.sqrt(Math.max(l1,1e-8)),sv2=1/Math.sqrt(Math.max(l2,1e-8));
  zx2=[];zy2=[];
  for(var i=0;i<N2;i++){
    zx2.push(sv1*(e1x*cx[i]+e1y*cy[i]));
    zy2.push(sv2*(e2x*cx[i]+e2y*cy[i]));
  }
}

function computeLandscape(){
  var f=fns2[fn2];
  var gaussRef=[];
  for(var i=0;i<N2;i++){var u=0;for(var j=0;j<12;j++)u+=Math.random();gaussRef.push(u-6);}
  var egGauss=gaussRef.reduce(function(a,v){return a+f.G(v);},0)/N2;
  landscape=[];
  var bestJ=0;peakAng=0;
  for(var a=0;a<=180;a++){
    var rad=a*Math.PI/180;
    var w0=Math.cos(rad),w1=Math.sin(rad);
    var eg=0;
    for(var i=0;i<N2;i++){eg+=f.G(w0*zx2[i]+w1*zy2[i]);}
    eg/=N2;
    var j=Math.pow(eg-egGauss,2);
    landscape.push(j);
    if(j>bestJ){bestJ=j;peakAng=a;}
  }
}

function drawLandscape(curAng){
  var cv=document.getElementById('cvLand');
  var ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  var pad=32,pw=W-2*pad,ph=H-2*pad;
  var maxJ=Math.max.apply(null,landscape)||1;

  ctx.strokeStyle=dk2?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)';
  ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(pad,H-pad);ctx.lineTo(W-pad,H-pad);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,H-pad);ctx.stroke();

  ctx.fillStyle=dk2?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.3)';
  ctx.font='11px "Anthropic Sans",sans-serif';
  ctx.fillText('0\u00b0',pad-4,H-pad+14);
  ctx.fillText('90\u00b0',pad+pw/2-8,H-pad+14);
  ctx.fillText('180\u00b0',W-pad-14,H-pad+14);
  ctx.save();ctx.translate(pad-16,pad+ph/2);ctx.rotate(-Math.PI/2);
  ctx.fillText('J(\u03b8)',0,0);ctx.restore();

  var f=fns2[fn2];
  ctx.strokeStyle=f.col;ctx.lineWidth=2;ctx.beginPath();
  for(var a=0;a<=180;a++){
    var x=pad+a/180*pw;
    var y=H-pad-(landscape[a]/maxJ)*ph*0.9;
    if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();

  var peakX=pad+peakAng/180*pw;
  var peakY=H-pad-(landscape[peakAng]/maxJ)*ph*0.9;
  ctx.fillStyle=dk2?'rgba(93,202,165,0.7)':'rgba(15,110,86,0.7)';
  ctx.beginPath();ctx.arc(peakX,peakY,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk2?'rgba(93,202,165,0.5)':'rgba(15,110,86,0.5)';
  ctx.font='11px "Anthropic Sans",sans-serif';
  ctx.fillText('peak',peakX-12,peakY-10);

  var curX=pad+curAng/180*pw;
  var curIdx=Math.min(180,Math.max(0,Math.round(curAng)));
  var curY=H-pad-(landscape[curIdx]/maxJ)*ph*0.9;
  ctx.fillStyle='#E24B4A';
  ctx.beginPath();ctx.arc(curX,curY,6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=dk2?'rgba(226,75,74,0.3)':'rgba(226,75,74,0.25)';
  ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(curX,curY);ctx.lineTo(curX,H-pad);ctx.stroke();
  ctx.setLineDash([]);
}

function drawProjView(ang){
  var cv=document.getElementById('cvProj');
  var ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  var midY=H*0.45;
  var scatterH=midY-16;
  var histH=H-midY-20;

  ctx.strokeStyle=dk2?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)';
  ctx.lineWidth=0.5;
  var cx=W/2,cy=scatterH/2+8;
  ctx.beginPath();ctx.moveTo(cx,8);ctx.lineTo(cx,scatterH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,cy);ctx.lineTo(W-16,cy);ctx.stroke();

  var sc=80;
  var ptCol=dk2?'rgba(175,169,236,0.3)':'rgba(83,74,183,0.25)';
  ctx.fillStyle=ptCol;
  for(var i=0;i<N2;i++){
    var px=cx+zx2[i]*sc,py=cy-zy2[i]*sc;
    if(px>4&&px<W-4&&py>4&&py<scatterH-4){ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill();}
  }

  var rad=ang*Math.PI/180;
  var w0=Math.cos(rad),w1=Math.sin(rad);
  ctx.strokeStyle='#E24B4A';ctx.lineWidth=2;
  var len=110;
  ctx.beginPath();ctx.moveTo(cx,cy);
  var ex=cx+w0*len,ey=cy-w1*len;
  ctx.lineTo(ex,ey);ctx.stroke();
  var aa=Math.atan2(-w1,w0);
  var ha=aa+Math.PI+0.4,hb=aa+Math.PI-0.4;
  ctx.beginPath();ctx.moveTo(ex+Math.cos(ha)*10,ey+Math.sin(ha)*10);
  ctx.lineTo(ex,ey);ctx.lineTo(ex+Math.cos(hb)*10,ey+Math.sin(hb)*10);ctx.stroke();
  ctx.fillStyle='#E24B4A';ctx.font='500 12px "Anthropic Sans",sans-serif';
  ctx.fillText('w',ex+8,ey-6);

  var proj=[];
  for(var i=0;i<N2;i++){proj.push(w0*zx2[i]+w1*zy2[i]);}
  var bins=32;
  var mn=Math.min.apply(null,proj),mx=Math.max.apply(null,proj);
  var range=mx-mn||1;
  var counts=[];for(var i=0;i<bins;i++)counts.push(0);
  for(var i=0;i<proj.length;i++){var idx=Math.min(bins-1,Math.floor((proj[i]-mn)/range*bins));if(idx>=0)counts[idx]++;}
  var maxC=Math.max.apply(null,counts)||1;
  var pad2=20;
  var bw=(W-2*pad2)/bins;

  ctx.fillStyle=dk2?'rgba(175,169,236,0.45)':'rgba(83,74,183,0.35)';
  for(var i=0;i<bins;i++){
    var bh=(counts[i]/maxC)*histH*0.8;
    ctx.fillRect(pad2+i*bw+1,H-10-bh,bw-2,bh);
  }
}

function updateAngle(){
  var a=parseFloat(document.getElementById('ang2').value);
  document.getElementById('ang2-v').textContent=a+'\u00b0';
  document.getElementById('m2-ang').textContent=a+'\u00b0';
  var idx=Math.min(180,Math.max(0,Math.round(a)));
  document.getElementById('m2-j').textContent=landscape[idx].toFixed(6);
  document.getElementById('m2-peak').textContent=peakAng+'\u00b0';
  drawLandscape(a);
  drawProjView(a);
}

function animateSweep(){
  if(anim2){clearInterval(anim2);anim2=null;}
  var a=0;
  var sl=document.getElementById('ang2');
  anim2=setInterval(function(){
    a+=1;
    if(a>180){clearInterval(anim2);anim2=null;return;}
    sl.value=a;updateAngle();
  },30);
}

function animateFastICA(){
  if(anim2){clearInterval(anim2);anim2=null;}
  var f=fns2[fn2];
  var ang=parseFloat(document.getElementById('ang2').value);
  var rad=ang*Math.PI/180;
  var w=[Math.cos(rad),Math.sin(rad)];
  var sl=document.getElementById('ang2');

  anim2=setInterval(function(){
    var g0=0,g1=0,gp=0;
    for(var i=0;i<N2;i++){
      var u=w[0]*zx2[i]+w[1]*zy2[i];
      var gv=f.g(u);
      g0+=zx2[i]*gv;g1+=zy2[i]*gv;gp+=f.gp(u);
    }
    g0/=N2;g1/=N2;gp/=N2;
    var nw=[g0-gp*w[0],g1-gp*w[1]];
    var nm=Math.sqrt(nw[0]*nw[0]+nw[1]*nw[1])||1;
    nw[0]/=nm;nw[1]/=nm;
    var dot=Math.abs(nw[0]*w[0]+nw[1]*w[1]);
    w[0]=nw[0];w[1]=nw[1];
    var a2=Math.atan2(w[1],w[0])*180/Math.PI;
    if(a2<0)a2+=180;
    sl.value=Math.round(a2);
    updateAngle();
    if(dot>0.99999){
      clearInterval(anim2);anim2=null;
      document.getElementById('expl2').textContent='Converged! FastICA climbed the negentropy landscape to angle '+Math.round(a2)+'\u00b0, which is a peak of J(\u03b8). This direction recovers one of the independent sources.';
    }
  },300);
}

function resetData2(){
  if(anim2){clearInterval(anim2);anim2=null;}
  genData2();computeLandscape();
  document.getElementById('ang2').value=0;
  document.getElementById('expl2').textContent='';
  updateAngle();
}

function renderFnSel2(){
  var el=document.getElementById('fsel2');
  el.innerHTML='';
  var names={logcosh:'logcosh / tanh',cube:'cube / u\u00b3',gauss:'exp / Gauss'};
  var keys=['logcosh','cube','gauss'];
  keys.forEach(function(k){
    var b=document.createElement('button');
    b.className='fn-btn'+(k===fn2?' on':'');
    b.textContent=names[k];
    b.onclick=function(){fn2=k;computeLandscape();updateAngle();renderFnSel2();};
    el.appendChild(b);
  });
}

genData2();computeLandscape();renderFnSel2();updateAngle();
</script>
