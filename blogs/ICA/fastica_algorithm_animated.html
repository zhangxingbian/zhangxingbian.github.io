<style>
.phase-pill{display:inline-block;padding:4px 12px;border-radius:var(--border-radius-md);font-size:12px;margin-right:6px;margin-bottom:6px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:transparent;color:var(--color-text-secondary);transition:all .2s}
.phase-pill.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.status-line{font-size:13px;color:var(--color-text-secondary);min-height:20px;margin:8px 0}
.metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
.metric-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px}
.metric-label{font-size:12px;color:var(--color-text-secondary)}
.metric-val{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-top:2px}
.formula-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 16px;font-family:var(--font-mono);font-size:13px;color:var(--color-text-primary);line-height:1.8;margin:8px 0}
</style>
<div style="padding:0.5rem 0">
<div id="pills"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0">
  <div>
    <canvas id="cv1" width="340" height="340" style="width:100%;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary)"></canvas>
    <div id="label1" style="text-align:center;font-size:12px;color:var(--color-text-secondary);margin-top:4px"></div>
  </div>
  <div>
    <canvas id="cv2" width="340" height="340" style="width:100%;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary)"></canvas>
    <div id="label2" style="text-align:center;font-size:12px;color:var(--color-text-secondary);margin-top:4px"></div>
  </div>
</div>
<div id="formula" class="formula-box" style="display:none"></div>
<div class="metric-row" id="metrics" style="display:none">
  <div class="metric-card"><div class="metric-label">Iteration</div><div class="metric-val" id="m-iter">0</div></div>
  <div class="metric-card"><div class="metric-label">Angle of w</div><div class="metric-val" id="m-angle">--</div></div>
  <div class="metric-card"><div class="metric-label">Convergence</div><div class="metric-val" id="m-conv">--</div></div>
</div>
<div class="status-line" id="status"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
  <button id="btn-run" onclick="runPhase()">Next step</button>
  <button onclick="resetAll()">Reset with new data</button>
  <button id="btn-auto" onclick="autoRun()">Auto-play all</button>
</div>
</div>
<script>
const dk = matchMedia('(prefers-color-scheme:dark)').matches;
const N = 600;
const phases = ['Original sources','Observed mixture','Centering','Whitening','FastICA iteration','Recovered sources'];
let phase = 0, iterCount = 0, animId = null;
let s1=[],s2=[],x1=[],x2=[],cx=[],cy=[],zx=[],zy=[];
let A, wHist=[], wCur=[1,0], converged=false;
let V00,V01,V10,V11;
let meanX,meanY;

function init(){
  s1=[];s2=[];
  for(let i=0;i<N;i++){s1.push(Math.random()*2-1);s2.push(Math.random()*2-1);}
  const a=0.4+Math.random()*0.7, b=0.3+Math.random()*0.6;
  const c=0.3+Math.random()*0.6, d=0.4+Math.random()*0.7;
  A=[[a,b],[c,d]];
  x1=[];x2=[];
  for(let i=0;i<N;i++){x1.push(A[0][0]*s1[i]+A[0][1]*s2[i]);x2.push(A[1][0]*s1[i]+A[1][1]*s2[i]);}
  cx=[];cy=[];zx=[];zy=[];
  wHist=[];wCur=[Math.random()-0.5,Math.random()-0.5];
  const n=Math.sqrt(wCur[0]**2+wCur[1]**2);
  wCur[0]/=n;wCur[1]/=n;
  converged=false;iterCount=0;
}

function center(){
  meanX=x1.reduce((a,b)=>a+b,0)/N;
  meanY=x2.reduce((a,b)=>a+b,0)/N;
  cx=x1.map(v=>v-meanX);cy=x2.map(v=>v-meanY);
}

function whiten(){
  let c00=0,c01=0,c11=0;
  for(let i=0;i<N;i++){c00+=cx[i]*cx[i];c01+=cx[i]*cy[i];c11+=cy[i]*cy[i];}
  c00/=N;c01/=N;c11/=N;
  const tr=c00+c11,det=c00*c11-c01*c01;
  const disc=Math.sqrt(Math.max(tr*tr/4-det,0));
  const l1=tr/2+disc,l2=tr/2-disc;
  let e1x=c01,e1y=l1-c00,e2x=c01,e2y=l2-c00;
  let n1=Math.sqrt(e1x*e1x+e1y*e1y)||1,n2=Math.sqrt(e2x*e2x+e2y*e2y)||1;
  e1x/=n1;e1y/=n1;e2x/=n2;e2y/=n2;
  const s1v=1/Math.sqrt(Math.max(l1,1e-8)),s2v=1/Math.sqrt(Math.max(l2,1e-8));
  V00=s1v*e1x;V01=s1v*e1y;V10=s2v*e2x;V11=s2v*e2y;
  zx=[];zy=[];
  for(let i=0;i<N;i++){
    zx.push(V00*cx[i]+V01*cy[i]);
    zy.push(V10*cx[i]+V11*cy[i]);
  }
}

function fastICAStep(){
  if(converged) return;
  const w0=wCur[0],w1=wCur[1];
  let gSum0=0,gSum1=0,gpSum=0;
  for(let i=0;i<N;i++){
    const u=w0*zx[i]+w1*zy[i];
    const th=Math.tanh(u);
    const gp=1-th*th;
    gSum0+=zx[i]*th;
    gSum1+=zy[i]*th;
    gpSum+=gp;
  }
  gSum0/=N;gSum1/=N;gpSum/=N;
  let nw0=gSum0-gpSum*w0;
  let nw1=gSum1-gpSum*w1;
  const nm=Math.sqrt(nw0*nw0+nw1*nw1)||1;
  nw0/=nm;nw1/=nm;
  const dot=Math.abs(nw0*w0+nw1*w1);
  wHist.push([w0,w1]);
  wCur=[nw0,nw1];
  iterCount++;
  if(dot>0.999999) converged=true;
  return dot;
}

function drawScatter(cvId,dataX,dataY,color,scale,extra){
  const cv=document.getElementById(cvId);
  const ctx=cv.getContext('2d');
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle=dk?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.07)';
  ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(w/2,8);ctx.lineTo(w/2,h-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,h/2);ctx.lineTo(w-8,h/2);ctx.stroke();
  ctx.fillStyle=color;
  for(let i=0;i<dataX.length;i++){
    const px=w/2+dataX[i]*scale,py=h/2-dataY[i]*scale;
    if(px>2&&px<w-2&&py>2&&py<h-2){ctx.beginPath();ctx.arc(px,py,1.8,0,Math.PI*2);ctx.fill();}
  }
  if(extra) extra(ctx,w,h,scale);
}

function drawW(ctx,w,h,scale){
  const len=140;
  ctx.save();
  wHist.forEach((wv,i)=>{
    const a=Math.min(0.15+i*0.04,0.5);
    ctx.strokeStyle=dk?`rgba(239,159,39,${a})`:`rgba(186,117,23,${a})`;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(w/2,h/2);
    ctx.lineTo(w/2+wv[0]*len*0.8,h/2-wv[1]*len*0.8);
    ctx.stroke();
  });
  ctx.strokeStyle='#E24B4A';ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(w/2,h/2);
  const ex=w/2+wCur[0]*len,ey=h/2-wCur[1]*len;
  ctx.lineTo(ex,ey);
  ctx.stroke();
  const ang=Math.atan2(-wCur[1],wCur[0]);
  const ha=ang+Math.PI+0.4,hb=ang+Math.PI-0.4;
  ctx.beginPath();
  ctx.moveTo(ex+Math.cos(ha)*12,ey+Math.sin(ha)*12);
  ctx.lineTo(ex,ey);
  ctx.lineTo(ex+Math.cos(hb)*12,ey+Math.sin(hb)*12);
  ctx.stroke();
  ctx.fillStyle='#E24B4A';ctx.font='500 14px "Anthropic Sans",sans-serif';
  ctx.fillText('w',ex+10,ey-6);
  ctx.restore();
}

function renderPills(){
  const el=document.getElementById('pills');
  el.innerHTML='';
  phases.forEach((p,i)=>{
    const b=document.createElement('span');
    b.className='phase-pill'+(i===phase?' active':'');
    b.textContent=p;
    b.onclick=()=>{if(i<=phase){phase=i;renderPhase();}};
    el.appendChild(b);
  });
}

function renderPhase(){
  renderPills();
  const st=document.getElementById('status');
  const fm=document.getElementById('formula');
  const mt=document.getElementById('metrics');
  fm.style.display='none';mt.style.display='none';
  const teal=dk?'rgba(93,202,165,0.4)':'rgba(29,158,117,0.35)';
  const purple=dk?'rgba(175,169,236,0.4)':'rgba(83,74,183,0.35)';
  const gray=dk?'rgba(180,178,169,0.35)':'rgba(96,94,90,0.25)';

  if(phase===0){
    st.textContent='Two independent uniform sources s\u2081 and s\u2082 — the unknowns we want to recover.';
    drawScatter('cv1',s1,s2,teal,140);
    document.getElementById('label1').textContent='Source space (s\u2081, s\u2082) — uniform square';
    const ctx2=document.getElementById('cv2').getContext('2d');
    ctx2.clearRect(0,0,340,340);
    document.getElementById('label2').textContent='';
  }else if(phase===1){
    st.textContent='After mixing x = As, the square becomes a parallelogram. We only observe x.';
    drawScatter('cv1',s1,s2,teal,140);
    document.getElementById('label1').textContent='Original sources (s\u2081, s\u2082)';
    drawScatter('cv2',x1,x2,gray,90);
    document.getElementById('label2').textContent='Mixed observations (x\u2081, x\u2082)';
    fm.style.display='block';
    fm.innerHTML='x = As &nbsp;&nbsp; where A = [['+A[0][0].toFixed(2)+', '+A[0][1].toFixed(2)+'], ['+A[1][0].toFixed(2)+', '+A[1][1].toFixed(2)+']]';
  }else if(phase===2){
    center();
    st.textContent='Subtract the mean so E{x} = 0. Shape unchanged, just re-centered.';
    drawScatter('cv1',x1,x2,gray,90);
    document.getElementById('label1').textContent='Before centering';
    drawScatter('cv2',cx,cy,gray,90);
    document.getElementById('label2').textContent='After centering: x\u0303 = x \u2212 E{x}';
    fm.style.display='block';
    fm.innerHTML='x\u0303 = x \u2212 E{x} &nbsp;&nbsp; mean = ('+meanX.toFixed(2)+', '+meanY.toFixed(2)+')';
  }else if(phase===3){
    center();whiten();
    st.textContent='Whitening: decorrelate + normalize variance. Parallelogram \u2192 rotated square. Now we only need to find a rotation.';
    drawScatter('cv1',cx,cy,gray,90);
    document.getElementById('label1').textContent='Centered (correlated ellipse)';
    drawScatter('cv2',zx,zy,purple,120);
    document.getElementById('label2').textContent='Whitened: z = Vx\u0303 (unit covariance)';
    fm.style.display='block';
    fm.innerHTML='C = E{x\u0303x\u0303\u1d40} = EDE\u1d40 &nbsp;\u2192&nbsp; V = D\u207b\u00bd E\u1d40 &nbsp;\u2192&nbsp; z = Vx\u0303 &nbsp;\u2192&nbsp; E{zz\u1d40} = I';
  }else if(phase===4){
    center();whiten();
    st.textContent=converged?'Converged! w found the direction of maximum non-Gaussianity in '+iterCount+' iterations.':'Click "Next step" to run one FastICA iteration, or "Auto-play" to watch it converge.';
    mt.style.display='grid';
    document.getElementById('m-iter').textContent=iterCount;
    const ang=Math.atan2(wCur[1],wCur[0])*180/Math.PI;
    document.getElementById('m-angle').textContent=ang.toFixed(1)+'\u00b0';
    document.getElementById('m-conv').textContent=converged?'Yes':'No';
    drawScatter('cv1',zx,zy,purple,120,drawW);
    document.getElementById('label1').textContent='Whitened data + w direction (red arrow)';
    const proj=zx.map((v,i)=>wCur[0]*v+wCur[1]*zy[i]);
    drawHist('cv2',proj);
    document.getElementById('label2').textContent='Histogram of w\u1d40z (should be non-Gaussian)';
    fm.style.display='block';
    fm.innerHTML='w\u207a = E{z\u00b7g(w\u1d40z)} \u2212 E{g\u2032(w\u1d40z)}\u00b7w &nbsp;&nbsp; then &nbsp; w = w\u207a / \u2016w\u207a\u2016 &nbsp;&nbsp; g(u) = tanh(u)';
  }else if(phase===5){
    center();whiten();
    const w2=[-wCur[1],wCur[0]];
    const r1=zx.map((v,i)=>wCur[0]*v+wCur[1]*zy[i]);
    const r2=zx.map((v,i)=>w2[0]*v+w2[1]*zy[i]);
    st.textContent='Both sources recovered! w\u2081 and w\u2082 = w\u2081\u22a5 give two independent components.';
    drawScatter('cv1',r1,r2,teal,120);
    document.getElementById('label1').textContent='Recovered sources (\u015d\u2081, \u015d\u2082) — square restored!';
    drawScatter('cv2',s1,s2,teal,140);
    document.getElementById('label2').textContent='Original sources (ground truth)';
    fm.style.display='block';
    fm.innerHTML='\u015d = W\u0303z &nbsp;&nbsp; W\u0303 = [w\u2081, w\u2082]\u1d40 &nbsp;&nbsp; Full unmixing: W = W\u0303\u00b7V';
  }
}

function drawHist(cvId,proj){
  const cv=document.getElementById(cvId);
  const ctx=cv.getContext('2d');
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  const bins=36;
  const mn=Math.min(...proj),mx=Math.max(...proj);
  const range=mx-mn||1;
  const counts=new Array(bins).fill(0);
  for(const v of proj){const idx=Math.min(bins-1,Math.floor((v-mn)/range*bins));counts[idx]++;}
  const maxC=Math.max(...counts);
  const pad=24,bw=(w-2*pad)/bins,barArea=h-2*pad;
  ctx.fillStyle=dk?'rgba(175,169,236,0.5)':'rgba(83,74,183,0.4)';
  for(let i=0;i<bins;i++){
    const bh=(counts[i]/maxC)*barArea*0.85;
    ctx.fillRect(pad+i*bw+1,h-pad-bh,bw-2,bh);
  }
  const sigma=Math.sqrt(proj.reduce((a,v)=>a+v*v,0)/N-(proj.reduce((a,v)=>a+v,0)/N)**2)||1;
  const mu=proj.reduce((a,v)=>a+v,0)/N;
  ctx.strokeStyle=dk?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.3)';
  ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();
  for(let i=0;i<=w-2*pad;i++){
    const xv=mn+(i/(w-2*pad))*range;
    const g=Math.exp(-0.5*((xv-mu)/sigma)**2)/(sigma*Math.sqrt(2*Math.PI));
    const gs=g*N*(range/bins);
    const py=h-pad-(gs/maxC)*barArea*0.85;
    if(i===0)ctx.moveTo(pad+i,py);else ctx.lineTo(pad+i,py);
  }
  ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=dk?'rgba(255,255,255,0.4)':'rgba(0,0,0,0.35)';
  ctx.font='12px "Anthropic Sans",sans-serif';
  ctx.fillText('--- Gaussian reference',pad,16);
}

function runPhase(){
  if(phase<4){phase++;renderPhase();return;}
  if(phase===4&&!converged){
    const dot=fastICAStep();
    renderPhase();
    if(converged) document.getElementById('status').textContent='Converged in '+iterCount+' iterations! Click "Next step" to see recovered sources.';
    return;
  }
  if(phase===4&&converged){phase=5;renderPhase();return;}
}

function autoRun(){
  if(animId){clearInterval(animId);animId=null;return;}
  if(phase<4){phase++;renderPhase();}
  if(phase===4){
    animId=setInterval(()=>{
      if(converged){
        clearInterval(animId);animId=null;
        setTimeout(()=>{phase=5;renderPhase();},600);
        return;
      }
      fastICAStep();renderPhase();
    },400);
  }
}

function resetAll(){
  if(animId){clearInterval(animId);animId=null;}
  phase=0;init();renderPhase();
}

init();renderPhase();
</script>
